{% extends "MonAppli_Immo/accueil.html" %}
{% load static %}  <!-- Charger le tag static -->

{% block content %}

<div style="max-width: 600px; margin: auto; padding: 20px; background:rgba(92, 72, 72, 0.85); border-radius: 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
    <h2 style="text-align: center; margin-bottom: 20px;">Ajouter un Acheteur ou un Vendeur</h2>

    <!-- Affichage des messages -->
    {% if messages %}
        <div>
            {% for message in messages %}
                <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
        {% csrf_token %}

        <div>
            <label for="type_personne" style="display: block; font-weight: bold;">Type de personne</label>
            <select name="type_personne" id="type_personne" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                <option value="">-- Sélectionnez --</option>
                <option value="acheteur">Acheteur</option>
                <option value="vendeur">Vendeur</option>
            </select>
        </div>

        <div>
            <label for="nom" style="display: block; font-weight: bold;">Nom</label>
            <input type="text" name="nom" id="nom" placeholder="Nom" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div>
            <label for="prenom" style="display: block; font-weight: bold;">Prénom</label>
            <input type="text" name="prenom" id="prenom" placeholder="Prénom" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div>
            <label for="email" style="display: block; font-weight: bold;">Email</label>
            <input type="email" name="email" id="email" placeholder="Email" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div>
            <label for="telephone" style="display: block; font-weight: bold;">Téléphone</label>
            <input type="text" name="telephone" id="telephone" placeholder="Téléphone" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div>
            <label for="code_postal" style="display: block; font-weight: bold;">Code postal</label>
            <input type="text" name="code_postal" id="code_postal" placeholder="Code postal" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div>
            <label for="ville" style="display: block; font-weight: bold;">Ville</label>
            <input type="text" name="ville" id="ville" placeholder="Ville" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button type="submit"   class="btn btn-primary"   style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
                Ajouter
            </button>
        </div>
    </form>
</div>
{% endblock %}
